name: Native AirPort build

on:
  push:
    branches: [native-airport-integration, 1.0.0-beta]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check RX ownership and AWDL power fencing
        run: |
          python3 tests/check_deferred_rx.py
          python3 tests/check_awdl_power.py
      - name: Bootstrap dependencies
        run: ./scripts/bootstrap-deps.sh
      - name: Build AirPortRTW
        run: make airport
      - name: Inspect bundle
        run: |
          test -f build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW
          plutil -lint build/out/AirPortRTW.kext/Contents/Info.plist
          file build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW
          lipo build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW -verify_arch x86_64
          python3 -c 'import plistlib; p=plistlib.load(open("build/out/AirPortRTW.kext/Contents/Info.plist", "rb")); assert p["CFBundleVersion"] == p["CFBundleShortVersionString"] == "1.0.2"; assert "1.0.2-beta.2" in p["CFBundleGetInfoString"]'
          strings build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW | grep -F "1.0.2-beta.2-awdl-power-fence"
          strings build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW | grep -F "AWDL_POWER_SUSPENDED"
          strings build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW | grep -F "RX_DEFER_MODE"

      - name: Package kext
        run: |
          cd build/out
          ditto -c -k --sequesterRsrc --keepParent AirPortRTW.kext AirPortRTW.kext.zip
          shasum -a 256 AirPortRTW.kext.zip > AirPortRTW.kext.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AirPortRTW-1.0.2-beta.2
          path: |
            build/out/AirPortRTW.kext.zip
            build/out/AirPortRTW.kext.zip.sha256
