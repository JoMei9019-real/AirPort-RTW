name: Native AirPort build

on:
  push:
    branches: [main, native-airport-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.ref != 'refs/heads/1.0.0-beta' && github.head_ref != '1.0.0-beta'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check ownership, power fencing and stability regressions
        run: |
          python3 tests/check_deferred_rx.py
          python3 tests/check_awdl_power.py
          python3 tests/check_link_events.py
          python3 tests/check_enterprise.py
          python3 tests/check_tx_batch.py
          python3 tests/check_workqueue.py
          python3 tests/check_scan_rx.py
          python3 tests/check_roaming.py
          python3 tests/check_roam_switch.py
          python3 tests/check_roam_diagnostics.py
          python3 tests/check_btm.py
          python3 tests/check_rrm.py
          python3 tests/check_lifecycle.py
          python3 tests/check_control_coordination.py
          python3 tests/check_tx_flow.py
          python3 tests/check_stack_budget.py --self-test
      - name: Bootstrap dependencies
        run: ./scripts/bootstrap-deps.sh
      - name: Build AirPortRTW
        run: |
          make airport
          xcrun clang -Wall -Wextra -Werror -arch x86_64 -mmacosx-version-min=13.0 ctl/roam-test.c -framework IOKit -framework CoreFoundation -o build/out/rtw88-roam
      - name: Enforce compiled IOCTL stack budgets
        run: python3 tests/check_stack_budget.py build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW
      - name: Inspect bundle
        run: |
          test -f build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW
          plutil -lint build/out/AirPortRTW.kext/Contents/Info.plist
          file build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW
          lipo build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW -verify_arch x86_64
          python3 -c 'import plistlib; p=plistlib.load(open("build/out/AirPortRTW.kext/Contents/Info.plist", "rb")); assert p["CFBundleVersion"] == p["CFBundleShortVersionString"] == "1.1.0"; assert "1.1.0" in p["CFBundleGetInfoString"] and "beta" not in p["CFBundleGetInfoString"]; assert p["IOKitPersonalities"]["AirPortRTW_8821CE"]["RoamingAssistEnabled"] is True; assert p["IOKitPersonalities"]["AirPortRTW_8821CE"]["RoamingSwitchEnabled"] is True; assert p["IOKitPersonalities"]["AirPortRTW_8821CE"]["RoamingAutoEnabled"] is True'
          strings build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW | grep -Fx "1.1.0"
          strings build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW | grep -F -- "-rtwnoautoroam"
          build/out/rtw88-roam --help
          strings build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW | grep -F "ROAM_K_REQUEST_SUBMITTED"
          strings build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW | grep -F "ROAM_R_FT_ENABLED"
          strings build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW | grep -F "btm-response-acked"
          strings build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW | grep -F "ROAM_K_BEACON_ADVERTISED"
          strings build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW | grep -F "rm_reports_submitted"
          strings build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW | grep -F "TX_BATCH_DEFERRED_FRAMES"
          nm build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW | grep -E ' [SD] _rtw8814a_hw_spec$'
          strings build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW | grep -F "rtw8814a_fw.bin"
          python3 -c 'import plistlib; p=plistlib.load(open("build/out/AirPortRTW.kext/Contents/Info.plist", "rb")); assert p["IOKitPersonalities"]["AirPortRTW_8814AE"]["IOPCIMatch"] == "0x881310EC"'
          strings build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW | grep -F "AWDL_POWER_SUSPENDED"
          strings build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW | grep -F "RX_DEFER_MODE"
          strings build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW | grep -F "STA_LINK_EVENT_TLV_BYTES"

      - name: Stage direct-download files (no nested archive)
        run: |
          mkdir -p build/package
          cp -R build/out/AirPortRTW.kext build/package/
          cp README.md RELEASE_1_1_0.md NOTICE.md build/package/
          cp -R docs build/package/
          python3 -c 'from pathlib import Path; p=Path("build/package"); assert (p/"AirPortRTW.kext/Contents/Info.plist").is_file(); assert not any(f.suffix in (".zip", ".tar", ".gz") for f in p.rglob("*") if f.is_file())'

      - uses: actions/upload-artifact@v4
        with:
          name: AirPortRTW-1.1.0
          path: build/package/

      - name: Package verified release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.head_commit.message == 'Release AirPort-RTW 1.1.0'
        run: |
          python3 - <<'PYZIP'
          from pathlib import Path
          import hashlib, stat, zipfile
          root = Path('build/package')
          assert not (root / 'rtw88-roam').exists()
          dest = Path('build/AirPortRTW-1.1.0.zip')
          with zipfile.ZipFile(dest, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for f in sorted(root.rglob('*')):
                  if f.is_file():
                      name = f.relative_to(root).as_posix()
                      info = zipfile.ZipInfo(name)
                      info.create_system = 3
                      mode = 0o755 if name == 'AirPortRTW.kext/Contents/MacOS/AirPortRTW' else 0o644
                      info.external_attr = (stat.S_IFREG | mode) << 16
                      z.writestr(info, f.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          with zipfile.ZipFile(dest) as z:
              assert z.testzip() is None
              assert 'AirPortRTW.kext/Contents/Info.plist' in z.namelist()
              assert not any(n.lower().endswith(('.zip', '.tar', '.gz')) for n in z.namelist())
          digest = hashlib.sha256(dest.read_bytes()).hexdigest()
          Path(str(dest) + '.sha256').write_text(digest + '  ' + dest.name + '\n')
          print(digest)
          PYZIP

      - name: Publish AirPort-RTW 1.1.0
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.head_commit.message == 'Release AirPort-RTW 1.1.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0 --draft --target "$GITHUB_SHA" --title "AirPort-RTW 1.1.0" --notes-file RELEASE_1_1_0.md
          gh release upload v1.1.0 build/AirPortRTW-1.1.0.zip build/AirPortRTW-1.1.0.zip.sha256
          gh release edit v1.1.0 --draft=false --latest
