name: Publish AirPort-RTW 1.0.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Prepare AirPort-RTW 1.0.1 release'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap dependencies
        run: ./scripts/bootstrap-deps.sh

      - name: Build AirPortRTW
        run: make airport

      - name: Validate and package
        run: |
          test -f build/out/AirPortRTW.kext/Contents/MacOS/AirPortRTW
          plutil -lint build/out/AirPortRTW.kext/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/out/AirPortRTW.kext/Contents/Info.plist | grep -qx '1.0.1'
          cd build/out
          ditto -c -k --sequesterRsrc --keepParent AirPortRTW.kext AirPortRTW.kext.zip
          shasum -a 256 AirPortRTW.kext.zip > AirPortRTW.kext.zip.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.1 \
            build/out/AirPortRTW.kext.zip \
            build/out/AirPortRTW.kext.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "AirPort-RTW 1.0.1" \
            --notes-file RELEASE_NOTES_1.0.1.md
